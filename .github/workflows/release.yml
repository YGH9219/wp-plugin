name: Release plugin

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build and verify
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v'
          $plugin = Get-Content -Raw personal-cta-blocks.php
          if ($plugin -notmatch "(?m)^\s*\*\s*Version:\s*$([regex]::Escape($version))\s*$") {
            throw "Tag $env:GITHUB_REF_NAME does not match the plugin version."
          }
          & ./scripts/build-plugin.ps1
          & ./tests/verify-pulse-button.ps1
          node ./tests/verify-pulse-button-editor.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $mount = "type=bind,source=$env:GITHUB_WORKSPACE,target=/app"
          docker run --rm --mount $mount -w /app php:7.4-cli sh -lc "find . -path ./dist -prune -o -type f -name '*.php' -print0 | xargs -0 -n1 php -l && php tests/verify-github-updater.php && php tests/verify-pulse-button-render.php && php tests/verify-social-thumbnail.php && php tests/verify-inline-images.php && php tests/verify-threads.php"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          docker run --rm --mount $mount -w /app php:8.3-cli sh -lc "find . -path ./dist -prune -o -type f -name '*.php' -print0 | xargs -0 -n1 php -l && php tests/verify-github-updater.php && php tests/verify-pulse-button-render.php && php tests/verify-social-thumbnail.php && php tests/verify-inline-images.php && php tests/verify-threads.php"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v'
          gh release create $env:GITHUB_REF_NAME "dist/personal-cta-blocks-$version.zip" --verify-tag --generate-notes
